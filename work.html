<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work | Jeonghyeok Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    /* ─── Work page layout ───────────────────────── */
    body { overflow-x: hidden; }

    #work-page {
      min-height: 100vh;
      padding: calc(var(--nav-h) + 60px) 48px 100px;
      max-width: 860px;
      margin: 0 auto;
    }

    #work-content { min-height: 60vh; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.91rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 48px;
      transition: color 0.2s;
    }
    .back-btn svg { transition: transform 0.2s; }
    .back-btn:hover { color: var(--text); }
    .back-btn:hover svg { transform: translateX(-4px); }

    /* ─── Meta header ────────────────────────────── */
    .work-header { margin-bottom: 64px; }

    .work-meta-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .work-category {
      font-size: 0.81rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 3px 10px;
    }

    .work-date {
      font-size: 0.91rem;
      color: var(--text-muted);
    }

    .work-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* ─── Tools ──────────────────────────────────── */
    .work-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tool-badge {
      font-size: 0.83rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
    }

    /* ─── External link button ───────────────────── */
    .work-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.91rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      margin-bottom: 48px;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .work-link-btn:hover {
      border-color: #aaaaaa;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .yt-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      margin: 32px 0;
      background: var(--surface);
    }
    .yt-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ─── Loading / Error states ─────────────────── */
    .work-loading, .work-error {
      padding: 80px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.03rem;
      letter-spacing: 0.08em;
    }
    .work-loading {
      opacity: 0;
      animation: fadeInLoading 0.3s ease 0.3s forwards;
    }
    @keyframes fadeInLoading { to { opacity: 1; } }
    .work-error { color: #b05555; }

    @media (max-width: 640px) {
      html { font-size: 12px; }
      #work-page { padding: calc(var(--nav-h) + 32px) 20px 72px; }
    }

  </style>
</head>
<body>

  <!-- Navigation -->
  <nav id="nav">
    <a href="index.html" class="nav-name">Jeonghyeok Song</a>
    <div class="nav-links">
      <a href="index.html#works">Works</a>
      <a href="index.html#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
    <button class="nav-hamburger" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main id="work-page">
    <a href="index.html#works" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Works
    </a>

    <div id="work-content">
      <p class="work-loading">Loading&hellip;</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    'use strict';

    // Nav scroll
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    // ─── img(.mp4/.webm) → video 치환 ─────────────
    function convertImgToVideo(html) {
      return html.replace(
        /<img\s+([^>]*?)src="([^"]+\.(?:mp4|webm|mov))"([^>]*)>/gi,
        (_, pre, src, post) => {
          const attrs = (pre + post).match(/title="[^"]*"/i);
          const titleAttr = attrs ? ' ' + attrs[0] : '';
          return `<video src="${src}#t=0.001" autoplay muted loop playsinline${titleAttr}></video>`;
        }
      );
    }

    // ─── compare 블록 → 슬라이더 치환 ────────────────
    function convertCompareBlocks(html, id) {
      return html.replace(
        /<pre><code class="language-compare">([\s\S]*?)<\/code><\/pre>/gi,
        (match, raw) => {
          const lines = raw.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .trim().split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) return match;
          const toSrc = f => /^https?:\/\/|^\//.test(f) ? f : `works/${id}/${f}`;
          const bSrc = toSrc(lines[0]), aSrc = toSrc(lines[1]);
          const bLabel = lines[2] || 'Before', aLabel = lines[3] || 'After';
          return `<div class="img-compare"><img class="compare-before" src="${bSrc}" alt="${bLabel}" loading="lazy"><img class="compare-after" src="${aSrc}" alt="${aLabel}" loading="lazy" style="clip-path:inset(0 50% 0 0)"><div class="img-compare-handle"><div class="img-compare-knob">&#9668;&#9658;</div></div><span class="compare-label compare-label-before">${bLabel}</span><span class="compare-label compare-label-after">${aLabel}</span></div>`;
        }
      );
    }

    function initCompareSliders(container) {
      container.querySelectorAll('.img-compare').forEach(el => {
        const after = el.querySelector('.compare-after');
        const handle = el.querySelector('.img-compare-handle');
        function set(clientX) {
          const rect = el.getBoundingClientRect();
          const pct = Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
          after.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
          handle.style.left = pct + '%';
        }
        let active = false;
        el.addEventListener('mousedown', e => { active = true; set(e.clientX); e.preventDefault(); });
        window.addEventListener('mousemove', e => { if (active) set(e.clientX); });
        window.addEventListener('mouseup', () => { active = false; });
        el.addEventListener('touchstart', e => { active = true; set(e.touches[0].clientX); }, { passive: true });
        window.addEventListener('touchmove', e => { if (active) set(e.touches[0].clientX); }, { passive: true });
        window.addEventListener('touchend', () => { active = false; });
      });
    }

    // ─── .md 링크 → work 페이지 링크 치환 ──────────
    function resolvePath(base, rel) {
      const parts = base.split('/');
      parts.pop();
      rel.split('/').forEach(seg => {
        if (seg === '..') parts.pop();
        else if (seg !== '.') parts.push(seg);
      });
      return parts.join('/');
    }

    function mdPathToWorkSlug(href, id) {
      if (/^https?:\/\//.test(href)) return null;
      let path;
      if (href.startsWith('works/') || href.startsWith('/works/')) {
        path = href.replace(/^\//, '');
      } else {
        path = resolvePath('works/' + id + '/', href);
      }
      const isNote = path.startsWith('notes/');
      let slug = path.replace(/^works\//, '').replace(/^notes\//, '').replace(/\.md$/, '');
      const parts = slug.split('/');
      if (parts.length >= 2 && (parts[parts.length - 1] === 'main' || parts[parts.length - 1] === parts[parts.length - 2])) {
        slug = parts.slice(0, -1).join('/');
      }
      return { slug, isNote };
    }

    function convertMdLinks(html, id) {
      return html.replace(
        /<a href="([^"#]+\.md)(#[^"]*)?"/gi,
        (m, path, hash) => {
          const result = mdPathToWorkSlug(path, id);
          if (!result) return m;
          const { slug, isNote } = result;
          const page = isNote ? 'blog.html' : 'work.html';
          return `<a href="${page}?id=${encodeURIComponent(slug)}${hash || ''}"`;
        }
      );
    }

    // ─── Alert 변환 ───────────────────────────────
    const ALERT_TYPES = { NOTE: 'Note', TIP: 'Tip', IMPORTANT: 'Important', WARNING: 'Warning', CAUTION: 'Caution' };
    function convertAlerts(html) {
      return html.replace(
        /<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\n?([\s\S]*?)<\/blockquote>/gi,
        (_, type, inner) => {
          const key = type.toUpperCase();
          const content = '<p>' + inner.trimStart();
          return `<div class="md-alert md-alert-${key.toLowerCase()}"><div class="md-alert-title">${ALERT_TYPES[key]}</div>${content}</div>`;
        }
      );
    }

    // ─── Frontmatter parser ───────────────────────
    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      });
      return { meta, body: m[2] };
    }

    // ─── Render page ──────────────────────────────
    function render({ meta, body }) {
      const title    = meta.title    || 'Untitled';
      const category = meta.category || '';
      const date     = meta.date     || '';
      const tools    = meta.tools    ? meta.tools.split(',').map(t => t.trim()) : [];
      const link     = meta.link     || '';

      document.title = title + ' | Jeonghyeok Song';

      const toolBadges = tools.map(t =>
        `<span class="tool-badge">${t}</span>`
      ).join('');

      const linkBtn = link
        ? `<a href="${link}" target="_blank" rel="noopener" class="work-link-btn">
             View on ArtStation
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
               <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
             </svg>
           </a>`
        : '';

      // YouTube URL → iframe 변환
      body = body.replace(
        /^[ \t]*(https?:\/\/(?:www\.youtube\.com\/watch\?(?:\S*&)?v=|youtu\.be\/)([A-Za-z0-9_-]{11})\S*)[ \t]*$/gm,
        (_, _url, id) =>
          `<div class="yt-embed"><iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      );

      document.getElementById('work-content').innerHTML = `
        <div class="work-header">
          <div class="work-meta-top">
            <span class="work-category">${category}</span>
            ${date ? `<span class="work-date">${date}</span>` : ''}
          </div>
          <h1 class="work-title">${title}</h1>
          ${tools.length ? `<div class="work-tools">${toolBadges}</div>` : ''}
          ${linkBtn}
        </div>
        <div class="md-body">${convertMdLinks(convertCompareBlocks(convertImgToVideo(convertAlerts(marked.parse(body, { breaks: true })).replace(/(<img[^>]+src=")(?!https?:\/\/|\/|data:)/g, `$1works/${id}/`)), id), id)}</div>
      `;

      postProcessTables(document.getElementById('work-content'));
      initCompareSliders(document.getElementById('work-content'));
      buildTOC();
    }

    // ─── Image table ───────────────────────────────
    function postProcessTables(container) {
      container.querySelectorAll('tr').forEach(tr => {
        if (tr.querySelector('td img, th img')) tr.classList.add('img-row');
      });

      container.querySelectorAll('table').forEach(table => {
        const imgRows = Array.from(table.querySelectorAll('tr.img-row'));
        if (!imgRows.length) return;

        // 이미지 로드 전 근사 크기 예약 (CLS 방지)
        imgRows.forEach(tr => {
          const cells = tr.querySelectorAll('td, th');
          const colCount = cells.length;
          const approxW = table.offsetWidth / colCount;
          const approxH = approxW * 0.67;
          cells.forEach(cell => {
            if (cell.querySelector('img')) {
              cell.style.width  = `${approxW}px`;
              cell.style.height = `${approxH}px`;
            }
          });
        });

        const allImgs = imgRows.flatMap(tr => Array.from(tr.querySelectorAll('img')));
        Promise.all(allImgs.map(img =>
          img.complete ? Promise.resolve(img)
            : new Promise(r => { img.onload = () => r(img); img.onerror = () => r(img); })
        )).then(() => {
          // 열별 최소 naturalWidth + 텍스트 열 여부
          const colMinW = {};
          let hasTextCols = false;
          imgRows.forEach(tr => {
            tr.querySelectorAll('td, th').forEach((cell, ci) => {
              const img = cell.querySelector('img');
              if (img) {
                colMinW[ci] = ci in colMinW ? Math.min(colMinW[ci], img.naturalWidth) : img.naturalWidth;
              } else {
                hasTextCols = true;
              }
            });
          });

          const totalNatW = Object.values(colMinW).reduce((a, b) => a + b, 0);
          const scale = hasTextCols ? 1 : table.offsetWidth / totalNatW;

          // img-row 셀 크기 적용
          imgRows.forEach(tr => {
            const cellH = Math.min(...Array.from(tr.querySelectorAll('img')).map(i => i.naturalHeight)) * scale;
            tr.querySelectorAll('td, th').forEach((cell, ci) => {
              if (ci in colMinW) {
                const w = colMinW[ci] * scale;
                cell.style.width  = `${w}px`;
                cell.style.height = `${cellH}px`;
                cell.style.flex   = 'none';
                const img = cell.querySelector('img');
                if (img) { img.style.width = `${w}px`; img.style.height = `${cellH}px`; }
              } else {
                cell.style.flex     = '1 1 0';
                cell.style.minWidth = '0';
                cell.style.height   = `${cellH}px`;
              }
            });
          });

          // 텍스트 행: flex 전환 + 동일 열 너비 + 보더 정리
          table.querySelectorAll('tr:not(.img-row)').forEach(tr => {
            tr.style.display = 'flex';
            const cells = tr.querySelectorAll('td, th');
            cells.forEach((cell, ci) => {
              if (ci in colMinW) {
                cell.style.width = `${colMinW[ci] * scale}px`;
                cell.style.flex  = 'none';
              } else {
                cell.style.flex     = '1 1 0';
                cell.style.minWidth = '0';
              }
              if (ci < cells.length - 1) cell.style.borderRight = 'none';
            });
          });
        });
      });
    }

    // ─── Load work data ───────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    if (!id) {
      window.location.replace('index.html#works');
    } else {
      const script = document.createElement('script');
      script.src = 'works/data.js';
      script.onload = () => {
        if (window.WORKS && window.WORKS[id]) {
          render(parseFrontmatter(window.WORKS[id]));
        } else {
          document.getElementById('work-content').innerHTML =
            '<p class="work-error">작품을 찾을 수 없습니다 (' + id + ')</p>';
        }
      };
      script.onerror = () => {
        document.getElementById('work-content').innerHTML =
          '<p class="work-error">데이터 파일을 불러올 수 없습니다.</p>';
      };
      document.head.appendChild(script);
    }
  </script>
  <script src="toc.js" defer></script>
  <script src="theme.js" defer></script>
</body>
</html>

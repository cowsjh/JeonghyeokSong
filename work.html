<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work | Jeonghyeok Song</title>
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    /* ─── Work page layout ───────────────────────── */
    body { overflow-x: hidden; }

    #work-page {
      min-height: 100vh;
      padding: calc(var(--nav-h) + 60px) 48px 100px;
      max-width: 860px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.91rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 48px;
      transition: color 0.2s;
    }
    .back-btn svg { transition: transform 0.2s; }
    .back-btn:hover { color: var(--text); }
    .back-btn:hover svg { transform: translateX(-4px); }

    /* ─── Meta header ────────────────────────────── */
    .work-header { margin-bottom: 64px; }

    .work-meta-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .work-category {
      font-size: 0.81rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 3px 10px;
    }

    .work-date {
      font-size: 0.91rem;
      color: var(--text-muted);
    }

    .work-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* ─── Tools ──────────────────────────────────── */
    .work-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tool-badge {
      font-size: 0.83rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
    }

    /* ─── External link button ───────────────────── */
    .work-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.91rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      margin-bottom: 48px;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .work-link-btn:hover {
      border-color: #aaaaaa;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .yt-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      margin: 32px 0;
      background: var(--surface);
    }
    .yt-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ─── Loading / Error states ─────────────────── */
    .work-loading, .work-error {
      padding: 80px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.03rem;
      letter-spacing: 0.08em;
    }
    .work-error { color: #b05555; }

    @media (max-width: 640px) {
      #work-page { padding: calc(var(--nav-h) + 32px) 20px 72px; }
    }

  </style>
</head>
<body>

  <!-- Navigation -->
  <nav id="nav">
    <a href="index.html" class="nav-name">Jeonghyeok Song</a>
    <div class="nav-links">
      <a href="index.html#works">Works</a>
      <a href="index.html#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
  </nav>

  <main id="work-page">
    <a href="index.html#works" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Gallery
    </a>

    <div id="work-content">
      <p class="work-loading">Loading&hellip;</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    'use strict';

    // Nav scroll
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    // ─── Frontmatter parser ───────────────────────
    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      });
      return { meta, body: m[2] };
    }

    // ─── Render page ──────────────────────────────
    function render({ meta, body }) {
      const title    = meta.title    || 'Untitled';
      const category = meta.category || '';
      const date     = meta.date     || '';
      const tools    = meta.tools    ? meta.tools.split(',').map(t => t.trim()) : [];
      const link     = meta.link     || '';

      document.title = title + ' | Jeonghyeok Song';

      const toolBadges = tools.map(t =>
        `<span class="tool-badge">${t}</span>`
      ).join('');

      const linkBtn = link
        ? `<a href="${link}" target="_blank" rel="noopener" class="work-link-btn">
             View on ArtStation
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
               <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
             </svg>
           </a>`
        : '';

      // YouTube URL → iframe 변환
      body = body.replace(
        /^[ \t]*(https?:\/\/(?:www\.youtube\.com\/watch\?(?:\S*&)?v=|youtu\.be\/)([A-Za-z0-9_-]{11})\S*)[ \t]*$/gm,
        (_, _url, id) =>
          `<div class="yt-embed"><iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      );

      document.getElementById('work-content').innerHTML = `
        <div class="work-header">
          <div class="work-meta-top">
            <span class="work-category">${category}</span>
            ${date ? `<span class="work-date">${date}</span>` : ''}
          </div>
          <h1 class="work-title">${title}</h1>
          ${tools.length ? `<div class="work-tools">${toolBadges}</div>` : ''}
          ${linkBtn}
        </div>
        <div class="md-body">${marked.parse(body).replace(/(<img[^>]+src=")(?!https?:\/\/|\/|data:)/g, `$1works/${id}/`)}</div>
      `;

      postProcessTables(document.getElementById('work-content'));
      buildTOC();
    }

    // ─── Image table → flex ───────────────────────
    function postProcessTables(container) {
      container.querySelectorAll('tr').forEach(tr => {
        const cells = Array.from(tr.querySelectorAll('td'));
        if (cells.length === 0) return;
        const allImgCells = cells.every(td => {
          const nonEmpty = Array.from(td.childNodes).filter(
            n => !(n.nodeType === 3 && n.textContent.trim() === '')
          );
          return nonEmpty.length > 0 && nonEmpty[0].tagName === 'IMG';
        });
        if (allImgCells) tr.classList.add('img-row');
      });
    }

    // ─── Load work data ───────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    if (!id) {
      window.location.replace('index.html#works');
    } else {
      const script = document.createElement('script');
      script.src = 'works/data.js';
      script.onload = () => {
        if (window.WORKS && window.WORKS[id]) {
          render(parseFrontmatter(window.WORKS[id]));
        } else {
          document.getElementById('work-content').innerHTML =
            '<p class="work-error">작품을 찾을 수 없습니다 (' + id + ')</p>';
        }
      };
      script.onerror = () => {
        document.getElementById('work-content').innerHTML =
          '<p class="work-error">데이터 파일을 불러올 수 없습니다.</p>';
      };
      document.head.appendChild(script);
    }
  </script>
  <script src="toc.js"></script>
  <script src="theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work | Jeonghyeok Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    /* ─── Work page layout ───────────────────────── */
    body { overflow-x: hidden; }

    #work-page {
      min-height: 100vh;
      padding: calc(var(--nav-h) + 60px) 48px 100px;
      max-width: 860px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 48px;
      transition: color 0.2s;
    }
    .back-btn svg { transition: transform 0.2s; }
    .back-btn:hover { color: var(--text); }
    .back-btn:hover svg { transform: translateX(-4px); }

    /* ─── Meta header ────────────────────────────── */
    .work-header { margin-bottom: 64px; }

    .work-meta-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .work-category {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 3px 10px;
    }

    .work-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .work-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* ─── Tools ──────────────────────────────────── */
    .work-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tool-badge {
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
    }

    /* ─── External link button ───────────────────── */
    .work-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      margin-bottom: 48px;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .work-link-btn:hover {
      border-color: #aaaaaa;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    /* ─── Markdown body ──────────────────────────── */
    .work-body {
      padding-top: 0;
    }

    .work-body h1 {
      font-family: var(--font-sans);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text);
      margin: 56px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .work-body h2 {
      font-family: var(--font-sans);
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text);
      margin: 48px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .work-body h3 {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 32px 0 10px;
    }

    .work-body p {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.85;
      color: var(--text);
      margin-bottom: 20px;
    }

    .work-body img {
      width: 100%;
      height: auto;
      display: block;
      margin: 32px 0;
      background: var(--surface);
    }

    .yt-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      margin: 32px 0;
      background: var(--surface);
    }
    .yt-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .work-body a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--border);
      transition: text-decoration-color 0.2s;
    }
    .work-body a:hover {
      text-decoration-color: var(--text-muted);
    }

    .work-body ul, .work-body ol {
      padding-left: 1.5em;
      margin-bottom: 20px;
    }

    .work-body li {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.8;
      color: var(--text);
    }

    /* ─── Loading / Error states ─────────────────── */
    .work-loading, .work-error {
      padding: 80px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }
    .work-error { color: #b05555; }

    @media (max-width: 640px) {
      #work-page { padding: calc(var(--nav-h) + 32px) 20px 72px; }
    }

    /* ─── TOC Sidebar ────────────────────────────── */
    .toc-sidebar {
      position: fixed;
      top: 0;
      right: 32px;
      width: 160px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .toc-sidebar.visible { opacity: 1; }

    @media (max-width: 768px) {
      .toc-sidebar { display: none; }
    }

    .toc-label {
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: right;
      margin-bottom: 12px;
    }

    .toc-link {
      font-size: 0.76rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-muted);
      padding: 5px 12px 5px 0;
      border-right: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s, border-color 0.2s;
    }
    .toc-link:hover { color: var(--text); }
    .toc-link.active {
      color: var(--text);
      border-right-color: var(--text);
    }
    .toc-link--h1 { font-weight: 500; color: var(--text); }
    .toc-link--h2 { padding-right: 20px; font-size: 0.72rem; }

    /* scroll offset for fixed nav */
    .work-body h1, .work-body h2 { scroll-margin-top: calc(var(--nav-h) + 24px); }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav id="nav">
    <a href="index.html" class="nav-name">Jeonghyeok Song</a>
    <div class="nav-links">
      <a href="index.html#works">Works</a>
      <a href="index.html#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
  </nav>

  <main id="work-page">
    <a href="index.html#works" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Gallery
    </a>

    <div id="work-content">
      <p class="work-loading">Loading&hellip;</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    'use strict';

    // Nav scroll
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    // ─── Frontmatter parser ───────────────────────
    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      });
      return { meta, body: m[2] };
    }

    // ─── Render page ──────────────────────────────
    function render({ meta, body }) {
      const title    = meta.title    || 'Untitled';
      const category = meta.category || '';
      const date     = meta.date     || '';
      const tools    = meta.tools    ? meta.tools.split(',').map(t => t.trim()) : [];
      const link     = meta.link     || '';

      document.title = title + ' | Jeonghyeok Song';

      const toolBadges = tools.map(t =>
        `<span class="tool-badge">${t}</span>`
      ).join('');

      const linkBtn = link
        ? `<a href="${link}" target="_blank" rel="noopener" class="work-link-btn">
             View on ArtStation
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
               <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
             </svg>
           </a>`
        : '';

      // YouTube URL → iframe 변환
      body = body.replace(
        /^[ \t]*(https?:\/\/(?:www\.youtube\.com\/watch\?(?:\S*&)?v=|youtu\.be\/)([A-Za-z0-9_-]{11})\S*)[ \t]*$/gm,
        (_, _url, id) =>
          `<div class="yt-embed"><iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      );

      document.getElementById('work-content').innerHTML = `
        <div class="work-header">
          <div class="work-meta-top">
            <span class="work-category">${category}</span>
            ${date ? `<span class="work-date">${date}</span>` : ''}
          </div>
          <h1 class="work-title">${title}</h1>
          ${tools.length ? `<div class="work-tools">${toolBadges}</div>` : ''}
          ${linkBtn}
        </div>
        <div class="work-body">${marked.parse(body).replace(/(<img[^>]+src=")(?!https?:\/\/|\/|data:)/g, `$1works/${id}/`)}</div>
      `;

      buildTOC();
    }

    // ─── TOC Sidebar ──────────────────────────────
    function buildTOC() {
      const headings = Array.from(document.querySelectorAll('.work-body h1, .work-body h2'));
      if (headings.length < 2) return;

      // Assign IDs
      headings.forEach((h, i) => {
        if (!h.id) {
          const slug = h.textContent.trim()
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-') || `section-${i}`;
          h.id = slug;
        }
      });

      // Build DOM
      const toc = document.createElement('nav');
      toc.className = 'toc-sidebar';
      toc.setAttribute('aria-label', 'Table of contents');

      const label = document.createElement('div');
      label.className = 'toc-label';
      label.textContent = 'Contents';
      toc.appendChild(label);

      const links = headings.map(h => {
        const a = document.createElement('a');
        a.className = h.tagName === 'H1' ? 'toc-link toc-link--h1' : 'toc-link toc-link--h2';
        a.href = `#${h.id}`;
        a.textContent = h.textContent.trim();
        a.title = h.textContent.trim();
        toc.appendChild(a);
        return a;
      });

      document.body.appendChild(toc);
      requestAnimationFrame(() => toc.classList.add('visible'));

      // Dynamic top: never above .work-body border line
      const workBody = document.querySelector('.work-body');
      const navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 64;
      const minTop = navH + 32;

      function updateTocTop() {
        if (!workBody) return;
        const bodyTop = workBody.getBoundingClientRect().top;
        const centerTop = window.innerHeight / 2 - toc.offsetHeight / 2;
        toc.style.top = Math.max(centerTop, bodyTop) + 'px';
      }

      updateTocTop();
      window.addEventListener('scroll', updateTocTop, { passive: true });
      window.addEventListener('resize', updateTocTop, { passive: true });

      // Smooth scroll
      toc.addEventListener('click', e => {
        const link = e.target.closest('.toc-link');
        if (!link) return;
        e.preventDefault();
        const target = document.getElementById(link.getAttribute('href').slice(1));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      // Active state via IntersectionObserver
      const linkMap = Object.fromEntries(links.map(a => [a.getAttribute('href').slice(1), a]));
      let activeId = null;

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            if (activeId) linkMap[activeId]?.classList.remove('active');
            activeId = entry.target.id;
            linkMap[activeId]?.classList.add('active');
          }
        });
      }, { rootMargin: '-8% 0px -80% 0px', threshold: 0 });

      headings.forEach(h => observer.observe(h));
    }

    // ─── Load work data ───────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    if (!id) {
      window.location.replace('index.html#works');
    } else {
      const script = document.createElement('script');
      script.src = 'works/data.js';
      script.onload = () => {
        if (window.WORKS && window.WORKS[id]) {
          render(parseFrontmatter(window.WORKS[id]));
        } else {
          document.getElementById('work-content').innerHTML =
            '<p class="work-error">작품을 찾을 수 없습니다 (' + id + ')</p>';
        }
      };
      script.onerror = () => {
        document.getElementById('work-content').innerHTML =
          '<p class="work-error">데이터 파일을 불러올 수 없습니다.</p>';
      };
      document.head.appendChild(script);
    }
  </script>
  <script src="theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes | Jeonghyeok Song</title>
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    body { overflow-x: hidden; }

    #blog-page {
      min-height: 100vh;
      padding: calc(var(--nav-h) + 60px) 48px 100px;
      max-width: 860px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.91rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 48px;
      transition: color 0.2s;
    }
    .back-btn svg { transition: transform 0.2s; }
    .back-btn:hover { color: var(--text); }
    .back-btn:hover svg { transform: translateX(-4px); }

    .blog-post-header { margin-bottom: 64px; }

    .blog-post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .blog-post-tag {
      display: inline-block;
      font-size: 0.81rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      cursor: pointer;
    }
    .blog-post-tag:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }
    .blog-post-tag--parent {
      color: var(--text);
      border-color: var(--text-muted);
      background: transparent;
    }
    .blog-post-tag--parent:hover {
      border-color: var(--text);
    }
    .blog-post-tag-sep {
      align-self: center;
      width: 1px;
      height: 12px;
      background: var(--border);
      margin: 0 4px;
    }

    .blog-post-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 12px;
    }

    .blog-post-date {
      font-size: 0.93rem;
      color: var(--text-muted);
    }

    /* ─── Series Nav ─────────────────────────────── */
    .series-nav {
      border: 1px solid var(--border);
      padding: 14px 18px;
      margin-bottom: 48px;
    }
    .series-nav-label {
      display: block;
      font-size: 0.83rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .series-nav-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .series-nav-pill {
      font-size: 0.88rem;
      padding: 3px 10px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .series-nav-pill:hover { border-color: var(--text-muted); color: var(--text); }
    .series-nav-pill--active { border-color: var(--text); color: var(--text); }

    .series-prevnext {
      display: flex;
      justify-content: space-between;
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      gap: 16px;
    }
    .series-prev, .series-next {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
      max-width: 48%;
    }
    .series-prev:hover, .series-next:hover { color: var(--text); }
    .series-next { text-align: right; margin-left: auto; }

    .post-loading, .post-error {
      padding: 80px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.03rem;
      letter-spacing: 0.08em;
    }
    .post-error { color: #b05555; }

    @media (max-width: 640px) {
      #blog-page { padding: calc(var(--nav-h) + 32px) 20px 72px; }
    }

  </style>
</head>
<body>

  <nav id="nav">
    <a href="index.html" class="nav-name">Jeonghyeok Song</a>
    <div class="nav-links">
      <a href="index.html#works">Works</a>
      <a href="index.html#notes">Notes</a>
      <a href="index.html#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
    <button class="nav-hamburger" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main id="blog-page">
    <a id="back-btn" href="index.html?tab=notes#portfolio" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Notes
    </a>
    <script>
      (function () {
        const saved = sessionStorage.getItem('notesFilterState');
        if (saved) {
          document.getElementById('back-btn').href = 'index.html' + saved + '#portfolio';
        }
      })();
    </script>

    <div id="post-content">
      <p class="post-loading">Loading&hellip;</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    'use strict';

    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      });
      return { meta, body: m[2] };
    }

    function buildSeriesData(id, series) {
      if (!series || !window.BLOG) return null;
      const slugs = Object.keys(window.BLOG)
        .filter(slug => {
          const { meta } = parseFrontmatter(window.BLOG[slug]);
          return meta.series === series;
        })
        .sort();
      if (slugs.length < 2) return null;
      const idx = slugs.indexOf(id);
      return {
        name:  series,
        slugs,
        idx,
        prev: idx > 0 ? slugs[idx - 1] : null,
        next: idx < slugs.length - 1 ? slugs[idx + 1] : null,
      };
    }

    // ─── Alert 변환 ───────────────────────────────
    const ALERT_TYPES = { NOTE: 'Note', TIP: 'Tip', IMPORTANT: 'Important', WARNING: 'Warning', CAUTION: 'Caution' };
    function convertAlerts(html) {
      return html.replace(
        /<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\n?([\s\S]*?)<\/blockquote>/gi,
        (_, type, inner) => {
          const key = type.toUpperCase();
          const content = '<p>' + inner.trimStart();
          return `<div class="md-alert md-alert-${key.toLowerCase()}"><div class="md-alert-title">${ALERT_TYPES[key]}</div>${content}</div>`;
        }
      );
    }

    function resolvePath(base, rel) {
      const parts = base.split('/');
      parts.pop();
      rel.split('/').forEach(seg => {
        if (seg === '..') parts.pop();
        else if (seg !== '.') parts.push(seg);
      });
      return parts.join('/');
    }

    function mdPathToSlug(href, id) {
      let path;
      if (/^https?:\/\//.test(href)) return null;
      if (href.startsWith('notes/') || href.startsWith('/notes/')) {
        path = href.replace(/^\//, '');
      } else {
        path = resolvePath('notes/' + id + '/', href);
      }
      let slug = path.replace(/^notes\//, '').replace(/\.md$/, '');
      const parts = slug.split('/');
      if (parts.length >= 2 && parts[parts.length - 1] === parts[parts.length - 2]) {
        slug = parts.slice(0, -1).join('/');
      }
      return slug;
    }

    function makeRenderer(id) {
      const r = new marked.Renderer();
      r.image = function(hrefOrToken, title, text) {
        let href, t, tx;
        if (hrefOrToken && typeof hrefOrToken === 'object') {
          href = hrefOrToken.href; t = hrefOrToken.title; tx = hrefOrToken.text;
        } else {
          href = hrefOrToken; t = title; tx = text;
        }
        const src = /^https?:\/\/|^\//.test(href) ? href : `notes/${id}/${href}`;
        return `<img src="${src}" alt="${tx || ''}"${t ? ` title="${t}"` : ''} loading="lazy">`;
      };
      r.link = function(hrefOrToken, title, text) {
        let href, t, tx;
        if (hrefOrToken && typeof hrefOrToken === 'object') {
          href = hrefOrToken.href; t = hrefOrToken.title; tx = hrefOrToken.text;
        } else {
          href = hrefOrToken; t = title; tx = text;
        }
        if (href && href.endsWith('.md')) {
          const slug = mdPathToSlug(href, id);
          if (slug) {
            return `<a href="blog.html?id=${encodeURIComponent(slug)}"${t ? ` title="${t}"` : ''}>${tx}</a>`;
          }
        }
        const external = /^https?:\/\//.test(href);
        return `<a href="${href}"${t ? ` title="${t}"` : ''}${external ? ' target="_blank" rel="noopener"' : ''}>${tx}</a>`;
      };
      return r;
    }

    function render({ meta, body }, id) {
      const title   = meta.title  || 'Untitled';
      const date    = meta.date   || '';
      const series  = meta.series || '';
      const parent  = id ? id.split('/')[0] : ''; // 폴더명 = 상위 태그
      const tags    = meta.tags ? meta.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : [];

      document.title = title + ' | Jeonghyeok Song';

      const parentPills = parent
        ? `<a class="blog-post-tag blog-post-tag--parent" href="index.html?tab=notes&parent=${encodeURIComponent(parent)}">${parent}</a>`
        : '';
      const childPills = tags
        .map(t => `<a class="blog-post-tag" href="index.html?parent=${encodeURIComponent(parent)}&child=${encodeURIComponent(t)}">${t}</a>`)
        .join('');
      const sep = parentPills && childPills ? `<span class="blog-post-tag-sep"></span>` : '';
      const tagPills = parentPills + sep + childPills;
      const dateStr  = date ? date.replace(/-/g, '.') : '';

      // 시리즈 네비게이션
      const sd = buildSeriesData(id, series);
      const seriesNavHtml = sd ? (() => {
        const pills = sd.slugs.map((slug, i) => {
          const num = String(i + 1).padStart(2, '0');
          const active = slug === id ? ' series-nav-pill--active' : '';
          return `<a href="blog.html?id=${slug}" class="series-nav-pill${active}">${num}</a>`;
        }).join('');
        return `<div class="series-nav">
          <span class="series-nav-label">Series &middot; ${sd.name}</span>
          <div class="series-nav-pills">${pills}</div>
        </div>`;
      })() : '';

      const prevNextHtml = sd ? (() => {
        const prevTitle = sd.prev ? parseFrontmatter(window.BLOG[sd.prev]).meta.title || sd.prev : null;
        const nextTitle = sd.next ? parseFrontmatter(window.BLOG[sd.next]).meta.title || sd.next : null;
        const prevLink  = prevTitle ? `<a href="blog.html?id=${sd.prev}" class="series-prev">&#9664; ${prevTitle}</a>` : '<span></span>';
        const nextLink  = nextTitle ? `<a href="blog.html?id=${sd.next}" class="series-next">${nextTitle} &#9654;</a>` : '';
        return `<div class="series-prevnext">${prevLink}${nextLink}</div>`;
      })() : '';

      document.getElementById('post-content').innerHTML = `
        <div class="blog-post-header">
          ${(parent || tags.length) ? `<div class="blog-post-tags">${tagPills}</div>` : ''}
          <h1 class="blog-post-title">${title}</h1>
          ${dateStr ? `<span class="blog-post-date">${dateStr}</span>` : ''}
        </div>
        ${seriesNavHtml}
        <div class="md-body">${convertAlerts(marked.parse(body, { renderer: makeRenderer(id) }))}</div>
        ${prevNextHtml}
      `;
      postProcessTables(document.getElementById('post-content'));
      buildTOC();
    }

    function postProcessTables(container) {
      container.querySelectorAll('tr').forEach(tr => {
        const cells = Array.from(tr.querySelectorAll('td'));
        if (cells.length === 0) return;
        const allImgCells = cells.every(td => {
          const nonEmpty = Array.from(td.childNodes).filter(
            n => !(n.nodeType === 3 && n.textContent.trim() === '')
          );
          return nonEmpty.length > 0 && nonEmpty[0].tagName === 'IMG';
        });
        if (allImgCells) tr.classList.add('img-row');
      });
    }


    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    if (!id) {
      window.location.replace('index.html#notes');
    } else {
      const script = document.createElement('script');
      script.src = 'notes/data.js';
      script.onload = () => {
        if (window.BLOG && window.BLOG[id]) {
          render(parseFrontmatter(window.BLOG[id]), id);
        } else {
          document.getElementById('post-content').innerHTML =
            '<p class="post-error">포스트를 찾을 수 없습니다 (' + id + ')</p>';
        }
      };
      script.onerror = () => {
        document.getElementById('post-content').innerHTML =
          '<p class="post-error">데이터 파일을 불러올 수 없습니다.</p>';
      };
      document.head.appendChild(script);
    }
  </script>
  <script src="toc.js"></script>
  <script src="theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes | Jeonghyeok Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=block">
  <link rel="stylesheet" href="style.css">
  <script>
    MathJax = {
      tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <script>(function(){
    var t=localStorage.getItem('theme')||'dark';
    var l=document.createElement('link');
    l.id='hljs-theme';l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/'+(t==='light'?'github':'github-dark')+'.min.css';
    document.head.appendChild(l);
  })();</script>
  <style>
    body { overflow-x: hidden; }

    #blog-page {
      min-height: 100vh;
      padding: calc(var(--nav-h) + 60px) 48px 100px;
      max-width: 860px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.91rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 48px;
      transition: color 0.2s;
    }
    .back-btn svg { transition: transform 0.2s; }
    .back-btn:hover { color: var(--text); }
    .back-btn:hover svg { transform: translateX(-4px); }

    .blog-post-header { margin-bottom: 64px; }

    .blog-post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .blog-post-tag {
      display: inline-block;
      font-size: 0.81rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      cursor: pointer;
    }
    .blog-post-tag:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }
    .blog-post-tag--parent {
      color: var(--text);
      border-color: var(--text-muted);
      background: transparent;
    }
    .blog-post-tag--parent:hover {
      border-color: var(--text);
    }
    .blog-post-tag-sep {
      align-self: center;
      width: 1px;
      height: 12px;
      background: var(--border);
      margin: 0 4px;
    }

    .blog-post-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 12px;
    }

    .blog-post-date {
      font-size: 0.93rem;
      color: var(--text-muted);
    }

    /* ─── Series Nav ─────────────────────────────── */
    .series-nav {
      border: 1px solid var(--border);
      padding: 14px 18px;
      margin-bottom: 48px;
    }
    .series-nav-label {
      display: block;
      font-size: 0.83rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .series-nav-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .series-nav-pill {
      font-size: 0.88rem;
      padding: 3px 10px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .series-nav-pill:hover { border-color: var(--text-muted); color: var(--text); }
    .series-nav-pill--active { border-color: var(--text); color: var(--text); }

    .series-prevnext {
      display: flex;
      justify-content: space-between;
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      gap: 16px;
    }
    .series-prev, .series-next {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
      max-width: 48%;
    }
    .series-prev:hover, .series-next:hover { color: var(--text); }
    .series-next { text-align: right; margin-left: auto; }

    .post-loading, .post-error {
      padding: 80px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.03rem;
      letter-spacing: 0.08em;
    }
    .post-error { color: #b05555; }

    .hljs-addition { background: none !important; color: #3fb950; }
    .hljs-deletion  { background: none !important; color: #f85149; }
    [data-theme="light"] .hljs-addition { color: #1a7f37; }
    [data-theme="light"] .hljs-deletion  { color: #cf222e; }

    @media (max-width: 640px) {
      html { font-size: 12px; }
      #blog-page { padding: calc(var(--nav-h) + 32px) 20px 72px; }
    }

  </style>
</head>
<body>

  <nav id="nav">
    <a href="index.html" class="nav-name">Jeonghyeok Song</a>
    <div class="nav-links">
      <a href="index.html#works">Works</a>
      <a href="index.html#notes">Notes</a>
      <a href="index.html#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
    <button class="nav-hamburger" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main id="blog-page">
    <a id="back-btn" href="index.html?tab=notes#portfolio" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Notes
    </a>
    <script>
      (function () {
        const saved = sessionStorage.getItem('notesFilterState');
        if (saved) {
          document.getElementById('back-btn').href = 'index.html' + saved + '#portfolio';
        }
      })();
    </script>

    <div id="post-content">
      <p class="post-loading">Loading&hellip;</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
  <script>
    'use strict';

    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      });
      return { meta, body: m[2] };
    }

    function buildSeriesData(id, series) {
      if (!series || !window.BLOG) return null;
      const slugs = Object.keys(window.BLOG)
        .filter(slug => {
          const { meta } = parseFrontmatter(window.BLOG[slug]);
          return meta.series === series;
        })
        .sort();
      if (slugs.length < 2) return null;
      const idx = slugs.indexOf(id);
      return {
        name:  series,
        slugs,
        idx,
        prev: idx > 0 ? slugs[idx - 1] : null,
        next: idx < slugs.length - 1 ? slugs[idx + 1] : null,
      };
    }

    // ─── Math 보호/복원 ──────────────────────────
    function protectMath(text) {
      const segs = [];
      let out = text;
      out = out.replace(/\$\$([\s\S]*?)\$\$/g, (_, m) => { segs.push({ d: true,  m }); return `\x02M${segs.length - 1}\x03`; });
      out = out.replace(/\$([^\n$]+?)\$/g,      (_, m) => { segs.push({ d: false, m }); return `\x02M${segs.length - 1}\x03`; });
      return { out, segs };
    }
    function restoreMath(html, segs) {
      return html.replace(/\x02M(\d+)\x03/g, (_, i) => {
        const { d, m } = segs[parseInt(i)];
        return d ? `$$${m}$$` : `$${m}$`;
      });
    }

    // ─── Alert 변환 ───────────────────────────────
    const ALERT_TYPES = { NOTE: 'Note', TIP: 'Tip', IMPORTANT: 'Important', WARNING: 'Warning', CAUTION: 'Caution' };
    function convertAlerts(html) {
      return html.replace(
        /<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\n?([\s\S]*?)<\/blockquote>/gi,
        (_, type, inner) => {
          const key = type.toUpperCase();
          const content = '<p>' + inner.trimStart();
          return `<div class="md-alert md-alert-${key.toLowerCase()}"><div class="md-alert-title">${ALERT_TYPES[key]}</div>${content}</div>`;
        }
      );
    }

    function resolvePath(base, rel) {
      const parts = base.split('/');
      parts.pop();
      rel.split('/').forEach(seg => {
        if (seg === '..') parts.pop();
        else if (seg !== '.') parts.push(seg);
      });
      return parts.join('/');
    }

    function mdPathToSlug(href, id) {
      let path;
      if (/^https?:\/\//.test(href)) return null;
      if (href.startsWith('notes/') || href.startsWith('/notes/')) {
        path = href.replace(/^\//, '');
      } else {
        path = resolvePath('notes/' + id + '/', href);
      }
      let slug = path.replace(/^notes\//, '').replace(/\.md$/, '');
      const parts = slug.split('/');
      if (parts.length >= 2 && (parts[parts.length - 1] === 'main' || parts[parts.length - 1] === parts[parts.length - 2])) {
        slug = parts.slice(0, -1).join('/');
      }
      return slug;
    }

    function makeRenderer(id) {
      const r = new marked.Renderer();
      r.image = function(hrefOrToken, title, text) {
        let href, t, tx;
        if (hrefOrToken && typeof hrefOrToken === 'object') {
          href = hrefOrToken.href; t = hrefOrToken.title; tx = hrefOrToken.text;
        } else {
          href = hrefOrToken; t = title; tx = text;
        }
        const src = /^https?:\/\/|^\//.test(href) ? href : `notes/${id}/${href}`;
        return `<img src="${src}" alt="${tx || ''}"${t ? ` title="${t}"` : ''} loading="lazy">`;
      };
      r.link = function(hrefOrToken, title, text) {
        let href, t, tx;
        if (hrefOrToken && typeof hrefOrToken === 'object') {
          href = hrefOrToken.href; t = hrefOrToken.title; tx = hrefOrToken.text;
        } else {
          href = hrefOrToken; t = title; tx = text;
        }
        if (href) {
          const mdMatch = href.match(/^([^#]+\.md)(#.*)?$/);
          if (mdMatch) {
            const slug = mdPathToSlug(mdMatch[1], id);
            if (slug) {
              const hash = mdMatch[2] || '';
              return `<a href="blog.html?id=${encodeURIComponent(slug)}${hash}"${t ? ` title="${t}"` : ''}>${tx}</a>`;
            }
          }
        }
        const external = /^https?:\/\//.test(href);
        return `<a href="${href}"${t ? ` title="${t}"` : ''}${external ? ' target="_blank" rel="noopener"' : ''}>${tx}</a>`;
      };
      r.code = function(token) {
        const code = typeof token === 'object' ? token.text : token;
        const lang = typeof token === 'object' ? token.lang : arguments[1];
        const language = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
        const highlighted = hljs.highlight(code, { language }).value;
        return `<pre><code class="hljs language-${language}">${highlighted}</code></pre>`;
      };
      return r;
    }

    new MutationObserver(() => {
      const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      const el = document.getElementById('hljs-theme');
      if (el) el.href = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/' + (isDark ? 'github-dark' : 'github') + '.min.css';
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    function render({ meta, body }, id) {
      const { out: protectedBody, segs: mathSegs } = protectMath(body);
      const title   = meta.title  || 'Untitled';
      const date    = meta.date   || '';
      const series  = meta.series || '';
      const parent  = id ? id.split('/')[0] : ''; // 폴더명 = 상위 태그
      const tags    = meta.tags ? meta.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : [];

      document.title = title + ' | Jeonghyeok Song';

      const parentPills = parent
        ? `<a class="blog-post-tag blog-post-tag--parent" href="index.html?tab=notes&parent=${encodeURIComponent(parent)}">${parent}</a>`
        : '';
      const childPills = tags
        .map(t => `<a class="blog-post-tag" href="index.html?parent=${encodeURIComponent(parent)}&child=${encodeURIComponent(t)}">${t}</a>`)
        .join('');
      const sep = parentPills && childPills ? `<span class="blog-post-tag-sep"></span>` : '';
      const tagPills = parentPills + sep + childPills;
      const dateStr  = date ? date.replace(/-/g, '.') : '';

      // 시리즈 네비게이션
      const sd = buildSeriesData(id, series);
      const seriesNavHtml = sd ? (() => {
        const pills = sd.slugs.map((slug, i) => {
          const num = String(i + 1).padStart(2, '0');
          const active = slug === id ? ' series-nav-pill--active' : '';
          return `<a href="blog.html?id=${slug}" class="series-nav-pill${active}">${num}</a>`;
        }).join('');
        return `<div class="series-nav">
          <span class="series-nav-label">Series &middot; ${sd.name}</span>
          <div class="series-nav-pills">${pills}</div>
        </div>`;
      })() : '';

      const prevNextHtml = sd ? (() => {
        const prevTitle = sd.prev ? parseFrontmatter(window.BLOG[sd.prev]).meta.title || sd.prev : null;
        const nextTitle = sd.next ? parseFrontmatter(window.BLOG[sd.next]).meta.title || sd.next : null;
        const prevLink  = prevTitle ? `<a href="blog.html?id=${sd.prev}" class="series-prev">&#9664; ${prevTitle}</a>` : '<span></span>';
        const nextLink  = nextTitle ? `<a href="blog.html?id=${sd.next}" class="series-next">${nextTitle} &#9654;</a>` : '';
        return `<div class="series-prevnext">${prevLink}${nextLink}</div>`;
      })() : '';

      document.getElementById('post-content').innerHTML = `
        <div class="blog-post-header">
          ${(parent || tags.length) ? `<div class="blog-post-tags">${tagPills}</div>` : ''}
          <h1 class="blog-post-title">${title}</h1>
          ${dateStr ? `<span class="blog-post-date">${dateStr}</span>` : ''}
        </div>
        ${seriesNavHtml}
        <div class="md-body">${convertAlerts(restoreMath(marked.parse(protectedBody, { renderer: makeRenderer(id), breaks: true }), mathSegs))}</div>
        ${prevNextHtml}
      `;
      const container = document.getElementById('post-content');
      postProcessTables(container);
      container.querySelectorAll('.md-body h1, .md-body h2, .md-body h3').forEach((h, i) => {
        if (!h.id) {
          h.id = h.textContent.trim().toLowerCase()
            .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-') || `section-${i}`;
        }
      });
      buildTOC();
      const mdBody = container.querySelector('.md-body');
      if (mdBody) mdBody.style.visibility = 'hidden';
      (function typesetWhenReady() {
        if (window.MathJax && MathJax.typesetPromise) {
          const toc = document.querySelector('.toc-sidebar');
          const targets = toc ? [container, toc] : [container];
          MathJax.typesetPromise(targets).then(() => {
            if (mdBody) mdBody.style.visibility = '';
            const searchQ = new URLSearchParams(location.search).get('q');
            if (searchQ && mdBody) {
              const imgs = Array.from(container.querySelectorAll('img')).filter(img => !img.complete);
              Promise.all(imgs.map(img => new Promise(r => { img.onload = img.onerror = r; })))
                .then(() => highlightFirstMatch(mdBody, searchQ));
            } else if (location.hash) {
              const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
              if (target) {
                const imgs = Array.from(container.querySelectorAll('img')).filter(img => !img.complete);
                Promise.all(imgs.map(img => new Promise(r => { img.onload = img.onerror = r; })))
                  .then(() => target.scrollIntoView());
              }
            }
          });
        } else {
          setTimeout(typesetWhenReady, 50);
        }
      })();
    }

    function highlightFirstMatch(root, query) {
      const q = query.toLowerCase();
      if (!q) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const p = node.parentNode;
          if (p && (p.tagName === 'SCRIPT' || p.tagName === 'STYLE')) return NodeFilter.FILTER_REJECT;
          return node.nodeValue.toLowerCase().includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const node = walker.nextNode();
      if (!node) return;
      const text = node.nodeValue;
      const idx = text.toLowerCase().indexOf(q);
      const before = document.createTextNode(text.slice(0, idx));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = text.slice(idx, idx + q.length);
      const after = document.createTextNode(text.slice(idx + q.length));
      const parent = node.parentNode;
      parent.insertBefore(before, node);
      parent.insertBefore(mark, node);
      parent.insertBefore(after, node);
      parent.removeChild(node);
      mark.scrollIntoView({ block: 'center' });
    }

    function postProcessTables(container) {
      container.querySelectorAll('tr').forEach(tr => {
        if (tr.querySelector('td img, th img')) tr.classList.add('img-row');
      });

      container.querySelectorAll('table').forEach(table => {
        const imgRows = Array.from(table.querySelectorAll('tr.img-row'));
        if (!imgRows.length) return;

        const allImgs = imgRows.flatMap(tr => Array.from(tr.querySelectorAll('img')));
        Promise.all(allImgs.map(img =>
          img.complete ? Promise.resolve(img)
            : new Promise(r => { img.onload = () => r(img); img.onerror = () => r(img); })
        )).then(() => {
          const colMinW = {};
          let hasTextCols = false;
          imgRows.forEach(tr => {
            tr.querySelectorAll('td, th').forEach((cell, ci) => {
              const img = cell.querySelector('img');
              if (img) {
                colMinW[ci] = ci in colMinW ? Math.min(colMinW[ci], img.naturalWidth) : img.naturalWidth;
              } else {
                hasTextCols = true;
              }
            });
          });

          const totalNatW = Object.values(colMinW).reduce((a, b) => a + b, 0);
          const scale = hasTextCols ? 1 : table.offsetWidth / totalNatW;

          imgRows.forEach(tr => {
            const cellH = Math.min(...Array.from(tr.querySelectorAll('img')).map(i => i.naturalHeight)) * scale;
            tr.querySelectorAll('td, th').forEach((cell, ci) => {
              if (ci in colMinW) {
                const w = colMinW[ci] * scale;
                cell.style.width  = `${w}px`;
                cell.style.height = `${cellH}px`;
                cell.style.flex   = 'none';
                const img = cell.querySelector('img');
                if (img) { img.style.width = `${w}px`; img.style.height = `${cellH}px`; }
              } else {
                cell.style.flex     = '1 1 0';
                cell.style.minWidth = '0';
                cell.style.height   = `${cellH}px`;
              }
            });
          });

          table.querySelectorAll('tr:not(.img-row)').forEach(tr => {
            tr.style.display = 'flex';
            const cells = tr.querySelectorAll('td, th');
            cells.forEach((cell, ci) => {
              if (ci in colMinW) {
                cell.style.width = `${colMinW[ci] * scale}px`;
                cell.style.flex  = 'none';
              } else {
                cell.style.flex     = '1 1 0';
                cell.style.minWidth = '0';
              }
              if (ci < cells.length - 1) cell.style.borderRight = 'none';
            });
          });
        });
      });
    }


    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    if (!id) {
      window.location.replace('index.html#notes');
    } else {
      const script = document.createElement('script');
      script.src = 'notes/data.js';
      script.onload = () => {
        if (window.BLOG && window.BLOG[id]) {
          render(parseFrontmatter(window.BLOG[id]), id);
        } else {
          document.getElementById('post-content').innerHTML =
            '<p class="post-error">포스트를 찾을 수 없습니다 (' + id + ')</p>';
        }
      };
      script.onerror = () => {
        document.getElementById('post-content').innerHTML =
          '<p class="post-error">데이터 파일을 불러올 수 없습니다.</p>';
      };
      document.head.appendChild(script);
    }
  </script>
  <script src="toc.js"></script>
  <script src="theme.js"></script>
</body>
</html>

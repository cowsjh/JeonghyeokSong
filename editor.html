<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Editor</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #1e1e22; --panel: #26262b; --panel2: #2d2d33; --line: #3a3a42;
    --text: #e6e6ea; --muted: #9a9aa5; --accent: #6ea8fe; --accent2: #4a8cff;
    --ok: #4caf50; --danger: #e05656;
  }
  /* custom scrollbar */
  * { scrollbar-width: thin; scrollbar-color: #43434d transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #43434d; border-radius: 6px; border: 3px solid var(--bg); background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #56566280; background: #565662; border: 3px solid var(--bg); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  /* topbar */
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .topbar .title { font-weight: 600; margin-right: auto; font-size: 15px; }
  .topbar .status { font-size: 12px; color: var(--muted); margin-right: 6px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #34343b; }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button.primary:hover { background: #3a7cf0; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* right-click context menu */
  .ctx-menu { position: fixed; display: none; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px; z-index: 300; min-width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .ctx-menu.show { display: block; }
  .ctx-item { padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; }
  .ctx-item:hover { background: var(--panel); }
  .ctx-danger { color: #e98a8a; }
  .ctx-danger:hover { background: #4a2a2a; color: #fff; }

  /* panel toggle buttons (topbar) */
  .icon-btn { padding: 6px 9px; font-size: 14px; line-height: 1; }
  .icon-btn.off { opacity: .5; }

  /* tab bar (VSCode-style) */
  .tabbar { display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line);
    flex-shrink: 0; overflow-x: auto; overflow-y: hidden; min-height: 34px; }
  .tabbar:empty { display: none; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 0 10px 0 13px; font-size: 12.5px;
    cursor: pointer; border-right: 1px solid var(--line); background: var(--panel);
    color: var(--muted); white-space: nowrap; max-width: 220px; user-select: none; }
  .tab:hover { background: var(--panel2); }
  .tab.active { background: var(--bg); color: var(--text); }
  .tab .tname { overflow: hidden; text-overflow: ellipsis; }
  .tab .tx { font-size: 14px; line-height: 1; padding: 1px 4px; border-radius: 4px; color: var(--muted);
    visibility: hidden; flex-shrink: 0; }
  .tab:hover .tx, .tab.active .tx { visibility: visible; }
  .tab .tx:hover { background: var(--line); color: var(--text); }
  .tab.dirty .tname::after { content: ' ●'; color: var(--accent); }
  .tab.dirty .tx { visibility: hidden; }
  .tab.dirty:hover .tx { visibility: visible; }
  .tab.dirty:hover .tname::after { content: ''; }

  /* 3-column layout */
  .main { flex: 1; display: flex; min-height: 0; }
  .main.no-sidebar .sidebar { display: none; }
  .main.no-preview .preview-pane { display: none; }
  .main.no-preview .editor-pane { border-right: 0; }
  .sidebar {
    width: 240px; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; flex-shrink: 0; padding: 8px;
  }
  .search-wrap { position: relative; margin-bottom: 4px; }
  .sidebar-search {
    width: 100%; padding: 6px 26px 6px 9px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 5px; color: var(--text); font-size: 12.5px;
    outline: none;
  }
  .sidebar-search:focus { border-color: var(--accent2); }
  .sidebar-search::placeholder { color: var(--muted); }
  .search-clear { position: absolute; top: 1px; right: 1px; bottom: 1px; width: 24px;
    display: flex; align-items: center; justify-content: center; padding: 0;
    background: transparent; border: none; border-radius: 0 5px 5px 0;
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
  .search-clear:hover { color: var(--text); }
  .sidebar .group { display: flex; align-items: center; font-size: 11px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted); margin: 14px 6px 4px; }
  .sidebar .group .glabel { flex: 1; }
  .sidebar .add { opacity: 0; cursor: pointer; padding: 0 5px; font-size: 16px; line-height: 1;
    color: var(--muted); border-radius: 4px; flex-shrink: 0; }
  .sidebar .group:hover .add, .sidebar .folder:hover .add { opacity: 1; }
  .sidebar .add:hover { color: var(--accent); background: var(--panel2); }
  .sidebar .item {
    padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar .item:hover { background: var(--panel2); }
  .sidebar .item.active { background: var(--accent2); color: #fff; }
  .sidebar .item .draft { color: var(--muted); font-size: 10px; margin-left: 4px; }
  .sidebar .item.child { margin-left: 16px; }
  .sidebar .folder { padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px;
    display: flex; align-items: center; gap: 6px; user-select: none; }
  .sidebar .folder:hover { background: var(--panel2); }
  .sidebar .folder .arrow { width: 10px; color: var(--muted); font-size: 10px; flex-shrink: 0; }
  .sidebar .folder .fname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar .folder .count { color: var(--muted); font-size: 10px; flex-shrink: 0; }

  .editor-pane, .preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .editor-pane { border-right: 1px solid var(--line); }
  .pane-head { font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px; }
  .pane-head .pane-btn { margin-left: auto; padding: 2px 7px; font-size: 13px; line-height: 1;
    color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 5px; }
  .pane-head .pane-btn:hover { color: var(--text); background: var(--panel2); border-color: var(--line); }
  .pane-head .pane-btn.spin { animation: pane-spin .5s linear; }
  @keyframes pane-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* frontmatter form (edit view) */
  .fm-head { display: flex; align-items: center; gap: 6px; padding: 6px 14px; cursor: pointer;
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    background: var(--panel); border-bottom: 1px solid var(--line); user-select: none; flex-shrink: 0; }
  .fm-head:hover { color: var(--text); }
  .fm-head .fm-arrow { font-size: 10px; width: 10px; }
  .fm-form { padding: 10px 14px 6px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    max-height: 44%; overflow-y: auto; background: var(--panel); }
  .fm-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .fm-row > label.k { width: 78px; font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .4px; flex-shrink: 0; }
  .fm-row input[type=text] { flex: 1; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; color: var(--text); font-size: 12.5px; }
  /* custom toggle switch */
  .toggle { display: inline-flex; align-items: center; cursor: pointer; }
  .toggle input { display: none; }
  .toggle .track { width: 36px; height: 19px; border-radius: 10px; background: var(--line);
    position: relative; transition: background .15s; flex-shrink: 0; }
  .toggle .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #c8c8d0; transition: transform .15s, background .15s; }
  .toggle input:checked + .track { background: var(--accent2); }
  .toggle input:checked + .track::after { transform: translateX(17px); background: #fff; }
  .order-inline { display: inline-flex; align-items: center; gap: 6px; margin-left: 16px; }
  .order-inline .oi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .order-inline input { width: 70px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; color: var(--text); font-size: 12.5px; }
  .tag-box { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px 5px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
  .tagchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 4px 2px 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; }
  .tagchip .x { cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; padding: 0 2px; }
  .tagchip .x:hover { color: var(--danger); }
  .tag-input { flex: 1; min-width: 70px; border: none; background: transparent; color: var(--text);
    outline: none; font-size: 12px; padding: 2px; }
  .fm-sugg { margin: -2px 0 9px 86px; display: flex; flex-wrap: wrap; gap: 4px; }

  /* editor: transparent textarea over highlight layer */
  .editor-wrap { position: relative; flex: 1; min-height: 0; }
  .editor-wrap textarea, .md-highlight {
    position: absolute; inset: 0; margin: 0; padding: 14px; border: 0;
    font-family: 'Consolas', 'Courier New', monospace; font-size: 13.5px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; tab-size: 2;
    overflow-y: auto;
  }
  .editor-wrap textarea {
    background: transparent; color: transparent; caret-color: var(--text);
    resize: none; outline: none; z-index: 2;
  }
  .editor-wrap textarea::placeholder { color: var(--muted); }
  .editor-wrap textarea.dragover { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .md-highlight { z-index: 1; pointer-events: none; color: var(--text); background: var(--bg); }
  /* markdown token colors */
  .tk-head  { color: #82aaff; font-weight: 600; }
  .tk-img   { color: #c3e88d; }
  .tk-link  { color: #82aaff; }
  .tk-bold  { color: #ffcb6b; font-weight: 600; }
  .tk-code, .tk-codei { color: #f78c6c; }
  .tk-hr    { color: #5c6370; }
  .tk-quote { color: #8a90a0; font-style: italic; }
  .tk-list  { color: #f78c6c; }
  .tk-key   { color: #c792ea; }
  #previewFrame { flex: 1; width: 100%; border: 0; background: var(--bg); }

  /* create form */
  .create-form { padding: 22px; max-width: 520px; overflow-y: auto; }
  .create-form h2 { margin-top: 0; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; }
  .seg button.on { background: var(--accent2); color: #fff; }
  .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 11px; padding: 3px 8px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 12px; cursor: pointer; color: var(--muted); }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chips-hint { color: var(--muted); font-size: 11px; }
  /* series input with a dropdown chevron inside, on the right */
  .series-wrap { position: relative; }
  .series-wrap input { width: 100%; padding-right: 30px; }
  .series-toggle { position: absolute; top: 1px; right: 1px; bottom: 1px; width: 28px;
    display: flex; align-items: center; justify-content: center; padding: 0;
    background: transparent; border: none; border-radius: 0 6px 6px 0;
    color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer; }
  .series-toggle:hover { color: var(--text); }
  .series-toggle.on { color: var(--accent); }
  .series-list { position: absolute; top: calc(100% + 4px); right: 0; left: 0; z-index: 50;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px;
    max-height: 180px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; }
  .series-list.show { display: block; }
  .series-list .sl-item { padding: 6px 10px; font-size: 12.5px; border-radius: 4px; cursor: pointer; }
  .series-list .sl-item:hover { background: var(--panel); }
  .series-list .sl-empty { padding: 6px 10px; font-size: 11.5px; color: var(--muted); }

  /* toast */
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 18px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 70vw; white-space: pre-wrap; z-index: 100;
  }
  #toast.show { opacity: 1; }
  #toast.ok { border-color: #3a7a3a; }
  #toast.err { border-color: var(--danger); }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: center; justify-content: center; z-index: 200; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; width: 440px; max-width: 90vw; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal input { width: 100%; padding: 9px 11px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font-size: 13px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal .gitlog { font-family: monospace; font-size: 11.5px; color: var(--muted);
    white-space: pre-wrap; margin-top: 12px; max-height: 160px; overflow-y: auto; }
  /* review result */
  .review-body { max-height: 60vh; overflow-y: auto; font-size: 13px; }
  .rv-sec { margin-bottom: 14px; }
  .rv-sec h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .rv-ok { color: #6cc070; }
  .rv-bad { color: var(--danger); }
  .rv-warn { color: #e0b050; }
  .rv-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .rv-item .u { flex: 1; word-break: break-all; font-family: monospace; font-size: 12px; }
  .rv-item button { padding: 2px 8px; font-size: 11px; }

  /* find / replace bar */
  .find-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .find-bar input { padding: 5px 8px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; color: var(--text); font-size: 12.5px; outline: none; }
  .find-bar #findInput, .find-bar #replaceInput { width: 150px; }
  .find-bar input:focus { border-color: var(--accent2); }
  .find-bar button { padding: 5px 9px; font-size: 12px; }
  .find-bar .find-count { font-size: 11.5px; color: var(--muted); min-width: 40px; text-align: center; }
  .find-bar .find-close { margin-left: auto; }

  /* outline (headings) button + dropdown */
  .hbtn { padding: 3px 8px; font-size: 11px; color: var(--muted); background: transparent;
    border: 1px solid transparent; border-radius: 5px; cursor: pointer; margin-left: 8px; }
  .hbtn:hover { color: var(--text); background: var(--panel2); border-color: var(--line); }
  .outline-list { position: fixed; z-index: 250; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px; max-height: 60vh; overflow-y: auto; min-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; }
  .outline-list.show { display: block; }
  .outline-list .ol-item { padding: 5px 10px; font-size: 12.5px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; color: var(--text); }
  .outline-list .ol-item:hover { background: var(--panel); }
  .outline-list .ol-empty { padding: 6px 10px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <button id="toggleSidebar" class="icon-btn" title="Toggle list (Ctrl+B)">☰</button>
  <span class="title">✏️ Website Editor</span>
  <span class="status" id="statusText">…</span>
  <button id="togglePreview" class="icon-btn" title="Toggle preview (Ctrl+\)">⊟</button>
  <button id="reviewBtn" disabled>Review</button>
  <button id="saveBtn" disabled>Save</button>
  <button id="publishBtn" class="primary">Deploy</button>
  <button id="openBtn" disabled>Open</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="search-wrap">
      <input id="sidebarSearch" class="sidebar-search" placeholder="Search title or folder…" spellcheck="false">
      <button id="searchClear" class="search-clear" title="Clear" style="display:none">×</button>
    </div>
    <div id="sidebarList"></div>
  </div>

  <div class="editor-pane">
    <div class="tabbar" id="tabbar"></div>
    <div class="pane-head">
      <span id="editHead">Editor</span>
      <button id="outlineBtn" class="hbtn" title="Outline (headings)" style="display:none">⋯ Outline</button>
      <span id="dropHint" style="margin-left:auto; color:var(--muted)"></span>
    </div>
    <div class="fm-head" id="fmHead" style="display:none"><span class="fm-arrow" id="fmArrow">▾</span>Frontmatter</div>
    <div class="fm-form" id="fmForm" style="display:none"></div>
    <div class="find-bar" id="findBar" style="display:none">
      <input id="findInput" placeholder="Find" spellcheck="false">
      <span class="find-count" id="findCount">0/0</span>
      <button id="findPrev" title="Previous (Shift+Enter)">↑</button>
      <button id="findNext" title="Next (Enter)">↓</button>
      <input id="replaceInput" placeholder="Replace" spellcheck="false">
      <button id="replaceOne">Replace</button>
      <button id="replaceAll">All</button>
      <button id="findClose" class="find-close" title="Close (Esc)">×</button>
    </div>
    <div class="editor-wrap" id="editorWrap">
      <pre class="md-highlight" id="highlight" aria-hidden="true"></pre>
      <textarea id="editor" placeholder="Select a post on the left, or hover Works/Notes and click + to create one." spellcheck="false" disabled></textarea>
    </div>
    <div class="create-form" id="createForm" style="display:none"></div>
  </div>

  <div class="preview-pane">
    <div class="pane-head">Preview<button id="previewRefresh" class="pane-btn" title="Refresh preview">⟳</button></div>
    <iframe id="previewFrame" src="preview-frame.html"></iframe>
  </div>
</div>

<div id="toast"></div>

<div id="outlineList" class="outline-list"></div>

<div id="ctxMenu" class="ctx-menu">
  <div class="ctx-item" id="ctxCopyPath">Copy MD path</div>
  <div class="ctx-item" id="ctxOpenVscode">Open in VS Code</div>
  <div class="ctx-item ctx-danger" id="ctxDelete">Delete</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Deploy (commit &middot; push)</h3>
    <input id="commitMsg" placeholder="Commit message" value="update content">
    <div class="gitlog" id="gitlog"></div>
    <div class="row">
      <button id="modalCancel">Cancel</button>
      <button id="modalPush" class="primary">Push</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="reviewBg">
  <div class="modal" style="width:560px">
    <h3>Review</h3>
    <div class="review-body" id="reviewBody">Checking…</div>
    <div class="row">
      <button id="reviewRefresh">Re-check</button>
      <button id="reviewClose" class="primary">Close</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let DATA = null;          // /api/list result
let current = null;       // active tab's { type, slug } (null when none open)
let dirty = false;        // active tab's unsaved state
let expanded = new Set(); // expanded category folder keys (type:category)
let searchQuery = '';     // sidebar folder-name (slug) filter
let fmCurrent = null;     // active tab's frontmatter form state
let fmCollapsed = false;  // frontmatter section collapsed?
let tabs = [];            // open documents: { type, slug, title, body, fm, dirty, fmCollapsed }
let active = null;        // active tab object (null = create form / empty)

// ─── utils ───
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', kind === 'err' ? 4500 : 2200);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}
function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─── preview (rendered by preview-frame.html — identical to the live site) ───
let previewReady = false, previewPending = null, previewTimer = null;
function postPreview() {
  const frame = $('#previewFrame');
  const msg = current
    ? { kind: 'preview', type: current.type, slug: current.slug, body: $('#editor').value }

// ─── markdown syntax highlight (editor overlay) ───
function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function highlightInline(s) {
  s = s.replace(/(!\[[^\]]*\]\([^)]*\))/g, '<span class="tk-img">$1</span>');
  s = s.replace(/(^|[^!])(\[[^\]]*\]\([^)]*\))/g, '$1<span class="tk-link">$2</span>');
  s = s.replace(/(\*\*[^*]+\*\*|__[^_]+__)/g, '<span class="tk-bold">$1</span>');
  s = s.replace(/(`[^`]+`)/g, '<span class="tk-codei">$1</span>');
  return s;
}
function highlightMarkdown(src) {
  let fence = false;
  return src.split('\n').map(line => {
    const esc = escapeHtml(line);
    if (/^\s*```/.test(line)) { fence = !fence; return '<span class="tk-code">' + esc + '</span>'; }
    if (fence) return '<span class="tk-code">' + esc + '</span>';
    if (/^---\s*$/.test(line)) return '<span class="tk-hr">' + esc + '</span>';
    if (/^#{1,6}\s/.test(line)) return '<span class="tk-head">' + esc + '</span>';
    if (/^>\s?/.test(line)) return '<span class="tk-quote">' + highlightInline(esc) + '</span>';
    const h = esc.replace(/^(\s*)([-*+]|\d+\.)(\s)/, (_, sp, mk, sfx) => sp + '<span class="tk-list">' + mk + '</span>' + sfx);
    return highlightInline(h);
  }).join('\n');
}
function updateHighlight() {
  $('#highlight').innerHTML = highlightMarkdown($('#editor').value) + '\n';
}

// ─── existing tags within a category ───
function tagsForCategory(type, cat) {
  if (!cat) return [];
  const items = type === 'work' ? DATA.works : DATA.notes;
  const set = new Set();
  items.filter(it => it.category === cat)
    .forEach(it => (type === 'work' ? it.tools : it.tags).forEach(t => set.add(t)));
  return [...set].sort();
}

// ─── frontmatter parsing / form ───
function splitFrontmatter(content) {
  const m = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { fields: [], body: content };
  const fields = [];
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) fields.push({ key: line.slice(0, idx).trim(), value: line.slice(idx + 1).trim() });
  });
  return { fields, body: m[2] };
}
function fmCategory() {
  if (!fmCurrent) return '';
  if (fmCurrent.type === 'work') { const el = $('#fm-category'); return el ? el.value.trim() : ''; }
  return current ? current.slug.split('/')[0] : '';   // note category = parent folder
}
function renderTagSuggestions() {
  const sugg = $('#fm-tags-sugg'); if (!sugg) return;
  const cat = fmCategory();
  const pool = tagsForCategory(fmCurrent.type, cat).filter(t => !fmCurrent.tags.includes(t));
  sugg.innerHTML = pool.length
    ? pool.map(t => '<span class="chip">' + escAttr(t) + '</span>').join('')
    : '<span class="chips-hint">' + (cat ? 'No other tags in this category' : 'Set a category to see tag suggestions') + '</span>';
  sugg.querySelectorAll('.chip').forEach(c => c.onclick = () => addTag(c.textContent));
}
function renderTagEditor(focus) {
  const box = $('#fm-tags-box'); if (!box) return;
  box.innerHTML = fmCurrent.tags.map((t, i) =>
    '<span class="tagchip">' + escAttr(t) + '<span class="x" data-i="' + i + '">×</span></span>').join('') +
    '<input id="fm-tags-input" class="tag-input" placeholder="add tag…">';
  box.querySelectorAll('.tagchip .x').forEach(x => x.onclick = () => {
    fmCurrent.tags.splice(+x.getAttribute('data-i'), 1); dirty = true; renderTagEditor(); renderTagSuggestions();
  });
  const inp = $('#fm-tags-input');
  inp.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(inp.value, true); }
    else if (e.key === 'Backspace' && !inp.value && fmCurrent.tags.length) {
      fmCurrent.tags.pop(); dirty = true; renderTagEditor(true); renderTagSuggestions();

// ─── local backup of unsaved buffers (survives a browser/tab crash) ───
const BAK_KEY = 'editorBackup';

  tabs.forEach(t => {
    if (t.create || !t.dirty) return;
    bak[t.type + ':' + t.slug] = { type: t.type, slug: t.slug, title: t.title, content: assembleFromFm(t.fm, t.body) };
  });
  if (Object.keys(bak).length) localStorage.setItem(BAK_KEY, JSON.stringify(bak));

// on startup: offer to reopen any unsaved buffers from a previous session
function checkBackup() {
  if (!DATA) return;   // server unreachable — list didn't load, can't rebuild tabs
  let bak; try { bak = JSON.parse(localStorage.getItem(BAK_KEY) || 'null'); } catch { bak = null; }
  const entries = bak ? Object.values(bak) : [];
  if (!entries.length) return;
  const names = entries.map(e => '• ' + e.title).join('\n');
  if (!confirm('이전 세션에 저장하지 않은 변경 ' + entries.length + '개가 있습니다.\n\n' + names + '\n\n복구할까요?')) {
    localStorage.removeItem(BAK_KEY);
    return;
  }
  let last = null;
  entries.forEach(e => {
    const { fm, body } = makeFm(e.type, e.content);
    let tab = tabs.find(t => t.type === e.type && t.slug === e.slug);
    if (tab) { tab.body = body; tab.fm = fm; tab.dirty = true; }
    else { tab = { type: e.type, slug: e.slug, title: e.title, body, fm, dirty: true, fmCollapsed }; tabs.push(tab); }
    last = tab;
  });
  if (last) activateTab(last);
  toast('복구됨: ' + entries.length + '개', 'ok');
}

// ─── tabs ───
// build frontmatter form state + body from raw main.md content
function makeFm(type, content) {
  const { fields, body } = splitFrontmatter(content);
  const values = {}; const present = [];
  fields.forEach(f => { if (!(f.key in values)) present.push(f.key); values[f.key] = f.value; });
  const known = type === 'work'
    ? ['title', 'category', 'thumbnail', 'date', 'tools', 'featured', 'order', 'draft', 'link']
    : ['title', 'date', 'tags', 'featured', 'order', 'draft'];
  const tagKey = type === 'work' ? 'tools' : 'tags';
  const extra = present.filter(k => !known.includes(k));
  const fm = { type, values, known, extra, tagKey, tags: (values[tagKey] || '').split(',').map(s => s.trim()).filter(Boolean) };
  return { fm, body: body.replace(/^\n+/, '') };
}
// sync frontmatter DOM inputs back into the active fm state (before switching away)
function captureFmFromDom() {
  if (!fmCurrent) return;
  flushTagInput();
  fmCurrent.known.concat(fmCurrent.extra).forEach(k => {
    if (k === fmCurrent.tagKey) return;        // tags live in fmCurrent.tags
    const el = document.getElementById('fm-' + k);
    if (!el) return;
    fmCurrent.values[k] = el.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value;
  });
}

// ─── open a file (reuse tab if already open) ───
async function openFile(type, slug) {
  const existing = tabs.find(t => t.type === type && t.slug === slug);
  if (existing) return activateTab(existing);
  const res = await api('/api/file?type=' + type + '&slug=' + encodeURIComponent(slug));
  if (res.error) return toast('Failed to load', 'err');
  const item = (type === 'work' ? DATA.works : DATA.notes).find(it => it.slug === slug);
  const { fm, body } = makeFm(type, res.content);
  const tab = { type, slug, title: item ? item.title : slug, body, fm, dirty: false, fmCollapsed };
  tabs.push(tab);
  activateTab(tab);
}

// ─── save ───
async function save() {
  if (!current) return;
  flushTagInput();   // capture tag text typed without pressing Enter
  $('#saveBtn').disabled = true;
  const res = await api('/api/save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: current.type, slug: current.slug, content: assembleContent() }),
  });
  $('#saveBtn').disabled = false;
  if (res.ok) {
    dirty = false;
    if (active) {
      active.dirty = false;
      const tEl = $('#fm-title'); if (tEl && tEl.value.trim()) active.title = tEl.value.trim();
    }
    toast('Saved + synced', 'ok'); refreshStatus(); loadList(true); renderTabs(); backupDirty();
  } else toast('Save failed:\n' + (res.output || res.error || ''), 'err');
}

// ─── create form (lives in its own tab) ───

  return kebab ? t.toLowerCase().replace(/\s+/g, '-')

// ─── attach images/videos (drag & drop + paste) ───
const ta = $('#editor');
const MEDIA_RE = /\.(png|jpe?g|gif|webp|avif|mp4|webm|mov)$/i;
// insert text over the current selection while preserving the native undo stack (Ctrl+Z).
// execCommand keeps textarea history intact; falls back to a manual splice if it's unavailable
// (e.g. drop target not focused) — only that one edit loses undo in the fallback.
function insertAtCursor(text, selStart, selEnd) {
  ta.focus();
  const ok = document.execCommand && (text === ''
    ? document.execCommand('delete')
    : document.execCommand('insertText', false, text));
  if (!ok) {
    const s = ta.selectionStart;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + text.length;
  }
  if (selStart != null) { ta.selectionStart = selStart; ta.selectionEnd = selEnd != null ? selEnd : selStart; }
  markDirty(); updateHighlight(); renderPreview();
}
function extFromType(type) {
  return ({ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp',
    'image/avif': 'avif', 'video/mp4': 'mp4', 'video/webm': 'webm' })[type] || (type && type.split('/')[1]) || 'bin';
}
async function attachFile(file, paste) {
  if (!current) { toast('Open or create a post first', 'err'); return; }
  let name = file.name || '';
  // pasted screenshots are always image.png → unique name to avoid overwriting existing files
  if (paste && (!name || /^image\.(png|jpe?g|gif|webp)$/i.test(name))) {
    const ts = new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14);
    const ext = (name.match(/\.([a-z0-9]+)$/i) || [])[1] || extFromType(file.type);
    name = 'paste-' + ts + '.' + ext;
  }
  if (!name) return;
  const buf = await file.arrayBuffer();
  const q = '?type=' + current.type + '&slug=' + encodeURIComponent(current.slug) + '&name=' + encodeURIComponent(name);
  const res = await api('/api/upload' + q, { method: 'POST', body: buf });
  if (!res.ok) { toast('Upload failed', 'err'); return; }
  // wrap in <> when the filename has spaces, otherwise markdown breaks
  const ref = /\s/.test(res.name) ? '<' + res.name + '>' : res.name;
  const md = '![](' + ref + ')\n';
  insertAtCursor(md);
  toast('Attached: ' + res.name, 'ok');
}

ta.addEventListener('dragover', e => { e.preventDefault(); ta.classList.add('dragover'); });
ta.addEventListener('dragleave', () => ta.classList.remove('dragover'));
ta.addEventListener('drop', async e => {
  e.preventDefault(); ta.classList.remove('dragover');
  for (const file of [...e.dataTransfer.files]) await attachFile(file, false);
});
// relative path from the current file's folder to a target path (slash-separated)
function relPath(fromDir, toPath) {
  const f = fromDir.split('/').filter(Boolean);
  const t = toPath.split('/').filter(Boolean);
  let i = 0;
  while (i < f.length && i < t.length && f[i] === t[i]) i++;
  const rel = f.slice(i).map(() => '..').concat(t.slice(i)).join('/');
  return rel || toPath;
}
// turn a pasted "works/…/main.md" or "notes/…/main.md" path into a relative reference link
function insertMdReference(type, slug, path) {
  const list = type === 'work' ? DATA.works : DATA.notes;
  const item = list && list.find(it => it.slug === slug);
  const text = item ? item.title : slug;
  const fromDir = (current.type === 'work' ? 'works/' : 'notes/') + current.slug;
  const rel = relPath(fromDir, path);
  const md = '[' + text + '](' + rel + ')';
  const s = ta.selectionStart;
  insertAtCursor(md, s + 1, s + 1 + text.length);   // select link text for quick editing
}
ta.addEventListener('paste', async e => {
  const cd = e.clipboardData;
  if (!cd) return;
  const files = [...cd.files];
  if (!files.length) for (const it of cd.items) if (it.kind === 'file') { const f = it.getAsFile(); if (f) files.push(f); }
  const media = files.filter(f => /^(image|video)\//.test(f.type) || MEDIA_RE.test(f.name || ''));
  if (media.length) {
    e.preventDefault();
    for (const file of media) await attachFile(file, true);
    return;
  }
  const txt = (cd.getData('text/plain') || '').trim();
  // selected text + a pasted URL → markdown link [selection](url)
  if (current && ta.selectionStart !== ta.selectionEnd && /^https?:\/\/\S+$/.test(txt)) {
    e.preventDefault();
    const md = '[' + ta.value.slice(ta.selectionStart, ta.selectionEnd) + '](' + txt + ')';
    insertAtCursor(md);
    return;
  }
  // plain-text paste of a copied MD path → auto reference template
  const m = txt.match(/^(works|notes)\/(.+)\/main\.md$/);
  if (m && current) { e.preventDefault(); insertMdReference(m[1] === 'works' ? 'work' : 'note', m[2], txt); }
});

// ─── wrap selection: type a bracket/marker over a selection to surround it ───
const WRAP_PAIRS = { '(': ')', '[': ']', '{': '}', '<': '>', '"': '"', "'": "'", '`': '`', '*': '*', '_': '_', '~': '~' };
ta.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;   // leave shortcuts & IME alone
  const close = WRAP_PAIRS[e.key];
  if (!close || ta.selectionStart === ta.selectionEnd) return;       // only wrap a real selection
  e.preventDefault();
  const s = ta.selectionStart, en = ta.selectionEnd;
  insertAtCursor(e.key + ta.value.slice(s, en) + close, s + 1, en + 1);   // keep inner text selected → press again to nest (e.g. * → **)
});

// ─── list auto-continue + Tab indent ───
ta.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;

  // Enter on a list item → continue the list (empty item → exit)
  if (e.key === 'Enter' && ta.selectionStart === ta.selectionEnd) {
    const v = ta.value, s = ta.selectionStart;
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const line = v.slice(ls, s);
    const m = line.match(/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?/);
    if (!m) return;
    if (line.slice(m[0].length).trim() === '') {   // bare marker → drop it, exit the list
      e.preventDefault();
      ta.selectionStart = ls; ta.selectionEnd = s;
      insertAtCursor('');
      return;
    }
    e.preventDefault();
    const marker = /^\d+\.$/.test(m[2]) ? (parseInt(m[2], 10) + 1) + '.' : m[2];
    insertAtCursor('\n' + m[1] + marker + m[3] + (m[4] ? '[ ] ' : ''));
    return;
  }

  // Tab / Shift+Tab → indent / outdent (2 spaces)
  if (e.key === 'Tab') {
    e.preventDefault();
    const UNIT = '  ';
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    if (s === en && !e.shiftKey) { insertAtCursor(UNIT); return; }   // caret → spaces
    const start = v.lastIndexOf('\n', s - 1) + 1;
    if (s === en && e.shiftKey) {                                    // caret → outdent this line
      const lead = (v.slice(start).match(/^( {1,2}|\t)/) || [''])[0].length;
      if (!lead) return;
      ta.selectionStart = start; ta.selectionEnd = start + lead;
      insertAtCursor('', Math.max(start, s - lead));
      return;
    }
    let end = v.indexOf('\n', en); if (end === -1) end = v.length;   // selection → block indent/outdent
    const block = (e.shiftKey
      ? v.slice(start, end).split('\n').map(l => l.replace(/^( {1,2}|\t)/, ''))
      : v.slice(start, end).split('\n').map(l => (l.length ? UNIT + l : l))).join('\n');
    ta.selectionStart = start; ta.selectionEnd = end;
    insertAtCursor(block, start, start + block.length);
  }
});

function renderReview(r) {
  const body = $('#reviewBody');
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let h = '';

  h += '<div class="rv-sec"><h4>Images — missing</h4>' +
    (r.images.missing.length
      ? r.images.missing.map(n => '<div class="rv-item rv-bad">✗ <span class="u">' + esc(n) + '</span> (referenced but not in folder)</div>').join('')
      : '<div class="rv-ok">✓ none</div>') + '</div>';
  h += '<div class="rv-sec"><h4>Images — unused</h4>' +
    (r.images.orphan.length
      ? r.images.orphan.map(n => '<div class="rv-item rv-warn">• <span class="u">' + esc(n) + '</span>' +
          '<button data-del="' + esc(n) + '">Delete</button></div>').join('')
      : '<div class="rv-ok">✓ none</div>') + '</div>';

  h += '<div class="rv-sec"><h4>Frontmatter</h4>' +
    (r.frontmatter.missing.length
      ? r.frontmatter.missing.map(f => '<div class="rv-item rv-bad">✗ <span class="u">' + esc(f) + '</span> missing/empty</div>').join('')
      : '<div class="rv-ok">✓ all required fields present</div>') +
    r.frontmatter.notes.map(n => '<div class="rv-item rv-warn">⚠ ' + esc(n) + '</div>').join('') + '</div>';

  h += '<div class="rv-sec"><h4>Convert → WebP / WebM</h4>' +
    (r.convertible && r.convertible.length
      ? r.convertible.map(c => '<div class="rv-item rv-warn">• <span class="u">' + esc(c.name) + '</span> ' + c.sizeMB + 'MB → ' + c.target +
          '<button data-convert="' + esc(c.name) + '">Convert</button></div>').join('')
      : '<div class="rv-ok">✓ none (all WebP/WebM)</div>') + '</div>';

  const lcls = { ok: 'rv-ok', blocked: 'rv-warn', bad: 'rv-bad' };
  const lmark = { ok: '✓', blocked: '⚠', bad: '✗' };
  const lnote = { ok: '', blocked: ' (blocked — may be fine in a browser)', bad: ' (unreachable)' };
  h += '<div class="rv-sec"><h4>Links</h4>' +
    (r.links.length
      ? r.links.map(l => '<div class="rv-item ' + lcls[l.state] + '">' + lmark[l.state] +
          ' <span class="u">' + esc(l.url) + '</span> ' + (l.status || 'no response') + lnote[l.state] + '</div>').join('')
      : '<div class="rv-ok">no links</div>') + '</div>';

  body.innerHTML = h;
  body.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    const name = btn.getAttribute('data-del');
    btn.disabled = true;
    await api('/api/delete?type=' + current.type + '&slug=' + encodeURIComponent(current.slug) + '&name=' + encodeURIComponent(name), { method: 'POST' });
    toast('Deleted: ' + name, 'ok');
    runReview();
  });
  body.querySelectorAll('[data-convert]').forEach(btn => btn.onclick = async () => {
    const name = btn.getAttribute('data-convert');
    btn.disabled = true; btn.textContent = 'Converting…';
    const res = await api('/api/convert?type=' + current.type + '&slug=' + encodeURIComponent(current.slug) + '&name=' + encodeURIComponent(name), { method: 'POST' });
    if (res.ok) {
      toast('Converted: ' + name + ' → ' + res.newName + ' (' + res.beforeMB + 'MB → ' + res.afterMB + 'MB)', 'ok');
      // 서버가 main.md 참조를 갱신했으므로, 편집 버퍼의 파일명 참조도 동일하게 치환 (미저장 편집 보존)
      const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('([(</:\\s])' + esc, 'g');
      const ed = $('#editor'); ed.value = ed.value.replace(re, '$1' + res.newName);
      const thumb = $('#fm-thumbnail'); if (thumb && thumb.value.endsWith(name)) thumb.value = thumb.value.slice(0, -name.length) + res.newName;
      updateHighlight(); renderPreview(); refreshStatus(); runReview();
    } else { toast('Convert failed: ' + (res.error || ''), 'err'); btn.disabled = false; btn.textContent = 'Convert'; }
  });
}

  const start = findMatches[findIdx];
  ta.focus(); ta.setSelectionRange(start, start + $('#findInput').value.length);
  scrollToOffset(start);
  $('#findCount').textContent = (findIdx + 1) + '/' + findMatches.length;
}
function openFind() {
  if (!current) return;
  $('#findBar').style.display = 'flex';
  const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
  const fi = $('#findInput');
  if (sel && !sel.includes('\n')) fi.value = sel;
  fi.focus(); fi.select();
  findIdx = 0; findAll();
  if (findMatches.length) gotoMatch(0);
}
function closeFind() { $('#findBar').style.display = 'none'; ta.focus(); }
$('#findInput').addEventListener('input', () => { findIdx = 0; findAll(); if (findMatches.length) gotoMatch(0); });
$('#findInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoMatch(findIdx + (e.shiftKey ? -1 : 1)); }
  else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});
$('#replaceInput').addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeFind(); } });
$('#findNext').onclick = () => gotoMatch(findIdx + 1);
$('#findPrev').onclick = () => gotoMatch(findIdx - 1);
$('#findClose').onclick = closeFind;
$('#replaceOne').onclick = () => {
  if (findIdx < 0 || !findMatches.length) return;
  const start = findMatches[findIdx];
  ta.focus(); ta.setSelectionRange(start, start + $('#findInput').value.length);
  insertAtCursor($('#replaceInput').value);   // undoable
  findAll();
  if (findMatches.length) gotoMatch(findIdx);
};
$('#replaceAll').onclick = () => {
  const q = $('#findInput').value; if (!q) return;
  const rep = $('#replaceInput').value, v = ta.value, vl = v.toLowerCase(), ql = q.toLowerCase();
  let result = '', last = 0, n = 0;
  for (let i = vl.indexOf(ql); i !== -1; i = vl.indexOf(ql, last)) { result += v.slice(last, i) + rep; last = i + ql.length; n++; }
  if (!n) return;
  result += v.slice(last);
  ta.value = result; markDirty(); updateHighlight(); renderPreview();
  findAll(); toast(n + ' replaced', 'ok');
};

// ─── heading outline ───
function jumpTo(pos) {
  ta.focus();
  let lineEnd = ta.value.indexOf('\n', pos); if (lineEnd === -1) lineEnd = ta.value.length;
  ta.setSelectionRange(pos, lineEnd);
  scrollToOffset(pos);
}
$('#outlineBtn').onclick = e => {
  e.stopPropagation();
  const list = $('#outlineList');
  if (list.classList.contains('show')) { list.classList.remove('show'); return; }
  const v = ta.value, headings = [];
  const fm = v.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/);
  const fmEnd = fm ? fm[0].length : 0;
  const re = /^(#{1,6})[ \t]+(.+?)\s*$/gm;
  for (let m; (m = re.exec(v)); ) if (m.index >= fmEnd) headings.push({ level: m[1].length, text: m[2], pos: m.index });
  list.innerHTML = headings.length
    ? headings.map((h, i) => '<div class="ol-item" data-i="' + i + '" style="padding-left:' +
        (10 + (h.level - 1) * 14) + 'px">' + escAttr(h.text) + '</div>').join('')
    : '<div class="ol-empty">No headings</div>';
  list.querySelectorAll('.ol-item').forEach(el => el.onclick = () => {
    jumpTo(headings[+el.getAttribute('data-i')].pos);
    list.classList.remove('show');
  });
  const r = $('#outlineBtn').getBoundingClientRect();
  list.style.left = r.left + 'px'; list.style.top = (r.bottom + 4) + 'px';
  list.classList.add('show');
};
document.addEventListener('click', () => $('#outlineList').classList.remove('show'));

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (current) save(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); $('#toggleSidebar').onclick(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '\\') { e.preventDefault(); $('#togglePreview').onclick(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { if (current) { e.preventDefault(); openFind(); } }
  else if (e.key === 'Escape' && $('#findBar').style.display !== 'none') { e.preventDefault(); closeFind(); }
});
window.addEventListener('beforeunload', e => {
  if (dirty || tabs.some(t => t !== active && t.dirty)) { e.preventDefault(); e.returnValue = ''; }
});

loadList().then(checkBackup); refreshStatus();
</script>
</body>
</html>

      <div id="notes-mode-bar"></div>
      <div class="notes-grid" id="notes-grid">
        <p class="notes-loading">Loading&hellip;</p>
      </div>
    </div>
    <!-- Gallery panel -->

      <div class="gallery-grid" id="gallery-grid">
